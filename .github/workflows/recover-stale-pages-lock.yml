name: Recover Stale GENMERCH GitHub Pages Deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-stale-pages-lock.yml"

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  inspect-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stale Pages and deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_DEPLOYMENT: bf44c938314517231b0c31b2b2df8aa7cc1b7f41
        shell: bash
        run: |
          set -euo pipefail
          echo "Pages deployment status:"
          gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_DEPLOYMENT}" || true
          echo
          echo "Generic deployment records for the blocking SHA:"
          deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${STALE_PAGES_DEPLOYMENT}&per_page=100")"
          echo "${deployments}" | jq '[.[] | {id, sha, ref, task, environment, created_at, updated_at, statuses_url}]'
          ids="$(echo "${deployments}" | jq -r '.[].id')"
          for id in ${ids}; do
            echo
            echo "Statuses for deployment ${id}:"
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=10" || true
          done
