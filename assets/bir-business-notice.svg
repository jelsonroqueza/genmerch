<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 727" role="img" aria-labelledby="title desc">
  <title id="title">BIR notice supplied by the business owner</title>
  <desc id="desc">Display copy of the supplied receipt or invoice notice with the business name NNP2012, registered name NNP2012 Household Goods Store, and TIN and branch code as supplied.</desc>
  <rect width="1000" height="727" fill="#f9fbf4"/>
  <rect x="15" y="15" width="970" height="697" fill="#d8ff35" stroke="#111" stroke-width="9"/>
  <rect x="27" y="27" width="946" height="673" fill="none" stroke="#111" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#080808" text-anchor="middle" font-weight="900">
    <text x="500" y="91" font-size="43">This establishment MUST issue</text>
    <text x="500" y="147" font-size="50">RECEIPT / INVOICE</text>
    <text x="500" y="190" font-size="27">for each service rendered / sale of goods.</text>
  </g>
  <rect x="45" y="211" width="910" height="65" fill="#fff" stroke="#171717" stroke-width="3"/>
  <text x="500" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900" fill="#080808">NNP2012</text>
  <text x="500" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#080808">Business Name</text>
  <rect x="45" y="311" width="910" height="65" fill="#fff" stroke="#171717" stroke-width="3"/>
  <text x="500" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#080808">NNP2012 HOUSEHOLD GOODS STORE</text>
  <text x="500" y="401" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#080808">Registered Name</text>
  <rect x="260" y="414" width="480" height="52" fill="#fff" stroke="#171717" stroke-width="3"/>
  <text x="500" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900" fill="#080808">416-182-189-00000</text>
  <text x="500" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#080808">TIN and Branch Code</text>
  <g transform="translate(180 565)">
    <circle r="65" fill="#fff" stroke="#111" stroke-width="6"/>
    <circle r="53" fill="#f4d34a" stroke="#111" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M-22 18 V-2 L-8 -19 L6 -2 V18 M9 18 V-8 L22 1 V18 M-31 20 H32" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="-29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#111">BIR</text>
    <text x="0" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" fill="#111">PHILIPPINES</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="800" fill="#080808">
    <text x="626" y="526" font-size="19">NOTICE ABOUT RECEIPT / INVOICE ISSUANCE</text>
    <text x="626" y="554" font-size="15">The source notice includes a penalty statement</text>
    <text x="626" y="576" font-size="15">and BIR contact/reporting details.</text>
    <text x="626" y="603" font-size="14">Refer to the original notice for its full wording.</text>
  </g>
  <text x="500" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#080808">Display copy recreated from the image supplied by the business owner.</text>
</svg>