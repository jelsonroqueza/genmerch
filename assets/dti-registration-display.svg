<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
<title id="title">DTI Business Name Registration — display copy</title>
<desc id="desc">A display rendering of the business-registration details visible in the document supplied by the business owner. Not the original certificate.</desc>
<rect width="900" height="1160" fill="#fff"/>
<rect x="32" y="32" width="836" height="1096" rx="4" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202020">
  <g transform="translate(72 56)">
    <text x="0" y="66" font-size="78" font-weight="800" letter-spacing="-7" fill="#1d2e7f">dti</text>
    <circle cx="85" cy="13" r="18" fill="#1d2e7f"/>
    <path d="M78 1l10 0 4 7 -3 6 5 6 -5 8 -6 -5 -5 -6 2 -5 -5 -4z" fill="#ffdf00"/>
    <text x="4" y="96" font-size="16" font-weight="700" letter-spacing="6" fill="#1d2e7f">PHILIPPINES</text>
  </g>
  <text x="450" y="185" text-anchor="middle" font-size="23" fill="#555">This certifies that</text>
  <text x="450" y="248" text-anchor="middle" font-size="31" font-weight="700">NNP2012 HOUSEHOLD GOODS STORE</text>
  <text x="450" y="280" text-anchor="middle" font-size="19">(BARANGAY)</text>
  <text x="450" y="321" text-anchor="middle" font-size="21">SANJA MAYOR, TANZA CAVITE - REGION IV-A (CALABARZON)</text>
  <text x="450" y="394" text-anchor="middle" font-size="20">is a business name registered in this office pursuant to the provisions of Act 3883,</text>
  <text x="450" y="425" text-anchor="middle" font-size="20">as amended by Act 4147 and Republic Act No. 863, and in compliance with</text>
  <text x="450" y="456" text-anchor="middle" font-size="20">the applicable rules and regulations prescribed by the Department of Trade and Industry.</text>
  <text x="450" y="517" text-anchor="middle" font-size="22">This certificate issued to</text>
  <text x="450" y="570" text-anchor="middle" font-size="32" font-weight="700">KING J.R OTORDOS CAISIP</text>
  <text x="450" y="630" text-anchor="middle" font-size="20">is valid from 04 January 2024 to 04 January 2029 subject to continuing compliance</text>
  <text x="450" y="660" text-anchor="middle" font-size="20">with the above-mentioned laws and all applicable laws of the Philippines, unless</text>
  <text x="450" y="690" text-anchor="middle" font-size="20">voluntarily cancelled.</text>
  <text x="450" y="748" text-anchor="middle" font-size="20">In testimony whereof, this certificate was issued on 04 January 2024 in the Philippines.</text>
  <text x="450" y="812" text-anchor="middle" font-size="31" font-weight="700">Certificate of Business Name Registration</text>
  <text x="450" y="860" text-anchor="middle" font-size="23" font-weight="700">Business Name No. 5481648</text>
  <path d="M170 900 H730" stroke="#d7d7d7" stroke-width="2"/>
  <text x="450" y="934" text-anchor="middle" font-size="17" fill="#666">Registration information transcribed from the owner-supplied document.</text>
  <text x="450" y="1050" text-anchor="middle" font-size="18" font-weight="700" fill="#7b342a">DISPLAY COPY — NOT THE ORIGINAL CERTIFICATE</text>
  <text x="450" y="1082" text-anchor="middle" font-size="15" fill="#666">For official use or verification, refer to the original issued document.</text>
</g>
<g transform="translate(450 580) rotate(-29)" opacity=".09">
  <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#c62828">DISPLAY COPY</text>
</g>
</svg>